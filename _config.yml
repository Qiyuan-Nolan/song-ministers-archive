##########
# collectionbuilder-gh
# Jekyll Digital Collection Generator, designed for GitHub Pages
# https://github.com/CollectionBuilder/collectionbuilder-gh
##########

##########
# URL VARIABLES [optional if using GitHub Pages!]
#
url: https://qiyuan-nolan.github.io
baseurl: /song-ministers-archive
# location of code, the full url to your github repository
source-code: https://github.com/Qiyuan-Nolan/song-ministers-archive

##########
# SITE SETTINGS
#
# title of site appears in banner
title: 宋初四臣言行錄數字檔案
# tagline, a short phrase that will appear throughout the site in the top banner
tagline: Words and Deeds of Four Early Song Ministers · A Digital Archive of the Wuchao mingchen yanxing lu
# description appears in meta tags and other locations
description: "A bilingual digital archive of the biographies of Zhao Pu, Cao Bin, Dou Yi and Li Fang in Zhu Xi's Wuchao mingchen yanxing lu, from the Sibu congkan facsimile of the Song edition."
# creator of the digital collection, to appear in meta tags
author: Qiyuan-Nolan

##########
# COLLECTION SETTINGS
#
# Use the filename of your CSV **without** the ".csv" extension
metadata: song-ministers-metadata

##########
# ROBOTS EXCLUDE
#
# set noindex to true if you do NOT want Google to index your site
# noindex: true 

##########
# BUILD SETTINGS 
#
exclude: [docs/, Rakefile, README.md, LICENSE, CITATION.cff, CODE_OF_CONDUCT.md, CONTRIBUTING.md]
# compress CSS output
sass:
  style: compressed
